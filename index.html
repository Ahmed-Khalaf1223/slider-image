<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>slider js</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="slider-container">
      <div id="slide-number" class="slide-number"></div>
      <img src="img/imgs-01.jpg" alt="" />
      <img src="img/imgs-02.jpg" alt="" />
      <img src="img/imgs-03.jpg" alt="" />
      <img src="img/imgs-04.jpg" alt="" />
      <img src="img/imgs-05.jpg" alt="" />
    </div>
    <div class="slider-controls">
      <button id="prev" class="prev">Previous</button>
      <span id="indicators" class="indicators"> </span>
      <button id="next" class="next">Next</button>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
